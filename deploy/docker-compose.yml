# Cambelt - the application, as a tenant.
#
# THIS FILE DESCRIBES ONE TENANT, NOT A MACHINE. It brings the two app containers and nothing else: no reverse
# proxy, no database server, no updater, no backup job, no published ports. Those belong to whichever host is
# running it, because a host with more than one tenant on it cannot be defined inside one of them (DEC-020).
#
#   Shared host (Asgard, cambelt.app):
#     docker compose --project-directory /srv/data/cambelt \
#       -f /srv/data/cambelt/src/deploy/docker-compose.yml \
#       --env-file /srv/infra/tenants/cambelt/.env up -d
#
#   Standalone (Synology, and any single-box checkout) - adds Postgres, Watchtower, the backup sidecar and a
#   published port, so the stack is self-contained exactly as it always was:
#     docker compose -f docker-compose.yml -f docker-compose.standalone.yml --profile standalone up -d
#
# Copy deploy/.env.example to .env beside this file for the standalone path. On the shared host the .env is
# rendered from Key Vault by the host and lives OUTSIDE ${DATA_ROOT} - see the README.

# The project name, stated rather than inferred. Container names, the Watchtower label scope and the Caddy
# upstream all derive from it, and without this line Compose uses the directory name - so everything
# downstream changes the day the checkout moves. It is `cambelt` because that is the tenant slug, which is
# also the database name, the role name and the network suffix.
name: cambelt

# Both external, and this file creates neither.
#
# A tenant that lets Compose create its own `data-cambelt` gets a fresh, empty network with no Postgres
# anywhere on it. The failure then reads as a DNS fault ("could not translate host name postgres") and is
# really a lifecycle bug, which is a bad half-hour. Declaring them external means Compose refuses to start at
# all if the host has not made them - a loud failure in place of a misleading one.
#
# docker-compose.standalone.yml turns both back off, because on a single box there is no host to make them.
networks:
  edge:
    external: true
  data-cambelt:
    external: true

services:
  # ---- the app ------------------------------------------------------------------------------------------
  webapi:
    image: ${DOCKERHUB_USER:-mgpeter}/cartracker-webapi:${TAG:-latest}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"   # opt this container into Watchtower auto-updates
    # Data network only. It must never be on `edge`: that network exists so Caddy can reach the one service
    # that is meant to be public, and the webapi is not it. Everything reaches the API through the gateway.
    networks:
      data-cambelt: {}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Parameterised for the shared host (database `cambelt`, role `cambelt`) while defaulting to the
      # standalone pair. The config KEY stays `ConnectionStrings__cartrackerdb` - that is the name the running
      # app reads, and renaming it would be a code change wearing a config change's clothes.
      #
      # `Maximum Pool Size` IS NOT OPTIONAL ON A SHARED SERVER. Npgsql defaults to 100 connections *per
      # connection string*; the host's cluster is configured for 150 *in total*. Two tenants at the default
      # can therefore starve the third, and the victim is whichever one restarts last. 20 is the agreed
      # starting figure.
      #
      # Not CARTRACKER_CONNECTION: that is read only by DesignTimeDbContextFactory, for `dotnet ef` at design
      # time, and has no effect whatsoever on the running container.
      ConnectionStrings__cartrackerdb: "Host=postgres;Port=5432;Database=${PGDATABASE:-cambelt};Username=${PGUSER:-cambelt};Password=${POSTGRES_PASSWORD};Maximum Pool Size=20"
      ApplyMigrationsOnStartup: "true"                  # single instance: bring the schema forward on boot
      # Workstation GC by default on the shared host, server GC on a box of our own. Server GC reserves a heap
      # per core, which is a real memory hog beside three or four neighbours on an 8 GiB VM. The `:-1` keeps
      # standalone behaviour exactly as it was.
      #
      # It must be named here to reach the container at all: --env-file only supplies values for ${...}
      # interpolation in this file, it does not inject anything into a container's environment. The host
      # renders DOTNET_gcServer into the tenant .env, and without this line it would go nowhere.
      DOTNET_gcServer: ${DOTNET_gcServer:-0}
      # Document bytes live on the volume below (DEC-005), NOT in the image. Without this pair the path
      # resolves inside the container and every Watchtower recreate destroys the uploads — and this container
      # is watchtower-labelled, so that is a routine event, not an edge case.
      Documents__RootPath: /documents
      # The Auth0 API (resource server) this deployment's tokens are checked against, and the tenant that
      # issues them. THE AUDIENCE IS A SECURITY BOUNDARY, NOT A LABEL: a bearer token is validated on
      # signature, issuer, audience and expiry, and nothing checks which client asked for it. So while the NAS
      # and the public site share an audience, a token minted against a box on a home LAN is cryptographically
      # valid on cambelt.app. They get separate APIs for that reason - `cartracker.api` and `cambelt.api`.
      #
      # The browser half of this pair is compiled into the SPA bundle and cannot be set here; it is a build
      # argument on the gateway image. See deploy/Dockerfile.gateway.
      Auth0__Audience: ${AUTH0_AUDIENCE:-cartracker.api}
      Auth0__Authority: ${AUTH0_AUTHORITY:-https://usualexpat.uk.auth0.com/}
      # DVLA/DVSA registration lookup (DEC-015), optional. Empty defaults are load-bearing: IsConfigured tests
      # IsNullOrWhiteSpace, so a blank reads as unconfigured and an .env without these keeps working unchanged
      # — the lookup answers 503 NotConfigured and add-car stays manual. Keys: see the README Quickstart.
      Lookup__VesApiKey: ${VES_API_KEY:-}
      Lookup__MotApiKey: ${MOT_API_KEY:-}
      Lookup__MotTokenUrl: ${MOT_TOKEN_URL:-}
      Lookup__MotClientId: ${MOT_CLIENT_ID:-}
      Lookup__MotClientSecret: ${MOT_CLIENT_SECRET:-}
      # Who may sign up. NOTE THE POLARITY AGAINST THE FIVE LINES ABOVE — it is the opposite one. A blank
      # Lookup__* means that feature is OFF and everything else carries on; A BLANK SIGNUP__* MEANS THE DOOR IS
      # SHUT and no unrecognised Auth0 login gets an account (403 "not yet invited", no user row written).
      # Existing accounts are never affected: the list decides who may join, not who may stay. Comma-separated
      # scalars, never indexed keys — an empty indexed element matches every address and opens the door.
      # THE TENANT MUST ALSO HAVE VERIFIED THE ADDRESS: on a database connection a stranger types their own,
      # so a domain listed here would otherwise admit anyone registering as `anything@that-domain`.
      Signup__AllowedEmails: ${SIGNUP_ALLOWED_EMAILS:-}
      Signup__AllowedDomains: ${SIGNUP_ALLOWED_DOMAINS:-}
      # The M2M credential that reads the real email address behind a login (the access token carries only
      # `auth0|…`) and whether it is verified, and deletes the identity when an account is deleted. Unset ⇒ no
      # address can be resolved ⇒ nobody new is admitted, whatever the allowlist says.
      Auth0__Management__ClientId: ${AUTH0_MANAGEMENT_CLIENT_ID:-}
      Auth0__Management__ClientSecret: ${AUTH0_MANAGEMENT_CLIENT_SECRET:-}
      # The one subject allowed to inherit vehicles with no owner (a one-off retrofit). Blank = never.
      Ownership__ClaimUnownedVehiclesFor: ${OWNERSHIP_CLAIM_UNOWNED_FOR:-}
      # The in-app assistant (DEC-019). Blank key ⇒ the whole feature is off: /api/chat answers 503 and the app
      # renders no chat entry point, the Lookup__* polarity rather than the Signup__* one.
      # THE TWO ALLOWANCES ARE A THIRD POLARITY AGAIN: blank falls back to the code default (1M per account,
      # 5M across the deployment, per day), while an explicit 0 TURNS THE CHAT OFF for that scope. Blank is not
      # zero here — write a number to lower it, write 0 to stop it.
      Chat__ApiKey: ${CHAT_API_KEY:-}
      Chat__Model: ${CHAT_MODEL:-}
      Chat__DailyTokensPerOwner: ${CHAT_DAILY_TOKENS_PER_OWNER:-}
      Chat__DailyTokensGlobal: ${CHAT_DAILY_TOKENS_GLOBAL:-}
    volumes:
      # Host bind mount, same reasoning as pgdata: it survives down, down -v, rebuilds and recreation, and
      # only deleting the host folder removes it. A named volume would be wiped by `down -v`, and documents
      # are evidence — the MOT certificate is supposed to outlive the record it was filed against.
      #
      # EVERY BIND MOUNT MUST STAY UNDER ${DATA_ROOT}. On the shared host that is /srv/data/cambelt, which is
      # what the host's restic job snapshots; bytes written anywhere else are simply not backed up, and
      # nothing would say so until a restore came up short.
      - ${DATA_ROOT:-/srv/data/cambelt}/documents:/documents
    depends_on:
      postgres:
        condition: service_healthy
        # `required: false` because on the shared host there is no `postgres` service in this file at all -
        # it is behind the standalone profile, and the database lives on the host's cluster. Without this,
        # Compose refuses the whole file with "depends on undefined service".
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/meta || exit 1"]  # /api/meta is anonymous
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  gateway:
    image: ${DOCKERHUB_USER:-mgpeter}/cartracker-gateway:${TAG:-latest}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # The only service on `edge`, because it is the only one meant to be reachable from outside.
    #
    # The alias is what Caddy targets - `cambelt-gateway`, not the container name. A container name is
    # `<project>_<service>_<n>` and moves when the service is renamed or the project is; an alias is a promise
    # this file makes to the host's proxy config, and the two are then free to change independently.
    networks:
      edge:
        aliases: [cambelt-gateway]
      data-cambelt: {}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DOTNET_gcServer: ${DOTNET_gcServer:-0}
      # Force the gateway's own listener to HTTP/1.1. A cleartext Kestrel advertises h2c, and a fronting proxy
      # (Caddy, Tailscale serve, or any reverse proxy) may forward over HTTP/2 cleartext - which the
      # in-container Kestrel mishandles, 502-ing the proxied request. TLS/HTTP-2 terminate at the proxy; this
      # internal hop stays 1.1.
      Kestrel__EndpointDefaults__Protocols: "Http1"
      # Point YARP straight at the webapi container. The gateway's appsettings destination is "http://webapi"
      # with no port; under Aspire that resolves via service discovery, but in plain compose the resolver falls
      # through to the literal host and defaults to port 80 — and the webapi listens on 8080, so it 502s.
      # Overriding the destination address with the explicit :8080 makes YARP connect to the right port.
      ReverseProxy__Clusters__webapi__Destinations__webapi__Address: "http://webapi:8080"
      # Force HTTP/1.1 on the gateway→webapi hop. YARP defaults to HTTP/2, but the webapi's cleartext Kestrel in
      # the container does not accept h2c, so every proxied request errors "before receiving a response" (a 502).
      # 1.1 over cleartext is exactly what a plain curl does, and there is no benefit to HTTP/2 on this internal hop.
      ReverseProxy__Clusters__webapi__HttpRequest__Version: "1.1"
      ReverseProxy__Clusters__webapi__HttpRequest__VersionPolicy: "RequestVersionExact"
      # WHICH AUTH0 APPLICATION THE BROWSER USES, and the tenant the Content-Security-Policy permits it to
      # call. The gateway serves these to the SPA as /config.js and emits the policy as a response header, so
      # ONE published image serves every deployment - including anyone self-hosting against their own tenant.
      #
      # They were compiled into the JS bundle until 0.21.0, which meant a second gateway image per release and
      # no way to deploy this without forking it.
      #
      # Blank falls back to this project's own application, so an existing .env keeps working untouched: the
      # Lookup__* polarity, not the Signup__* one. The audience must match the webapi's Auth0__Audience above
      # - they are two halves of one check, and a mismatch is a 401 on every request after a successful login.
      Auth0__Domain: ${AUTH0_SPA_DOMAIN:-}
      Auth0__ClientId: ${AUTH0_SPA_CLIENT_ID:-}
      Auth0__Audience: ${AUTH0_AUDIENCE:-}
    # NO `ports:` HERE, AND NOT EVEN 127.0.0.1. Caddy is the only listener on the shared box, and the host's
    # drift check fails the tenant outright on any container publishing to 0.0.0.0. It is not paranoia:
    # Docker publishes via DNAT off PREROUTING while ufw filters INPUT, so a published port is reachable from
    # the internet whatever the host firewall says.
    #
    # `ports:` cannot be hidden behind a profile - profiles gate whole services, not individual keys - so the
    # standalone override adds the mapping back instead.
    depends_on:
      webapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]          # serves the SPA index
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ---- the host's job, kept for a box that has no host ---------------------------------------------------
  #
  # These three run only under `--profile standalone`. On the shared machine every one of them is provided
  # once, for every tenant, by the host - and running a second copy is not redundancy, it is a conflict:
  #
  #   postgres    one cluster, one database and one role per tenant, tuned for the whole box
  #               (max_connections=150, shared_buffers=1GB). A per-tenant server would fight it for RAM.
  #   watchtower  one per host. Two would race each other over the same containers.
  #   db-backup   the host takes ONE restic snapshot per tenant covering the dump AND the on-disk documents
  #               together. A per-project sidecar is precisely what that design rejects: this one dumped
  #               faithfully to a local folder for months while the offsite leg was missing, which looked
  #               exactly like having backups.
  #
  # They are profiled rather than deleted because a fresh Synology checkout must still come up complete.
  postgres:
    profiles: [standalone]
    image: postgres:17-alpine
    networks:
      data-cambelt: {}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${PGDATABASE:-cambelt}
    volumes:
      - ${DATA_ROOT:-/volume1/docker/cartracker}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-cambelt} -d ${PGDATABASE:-cambelt}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  db-backup:
    profiles: [standalone]
    image: prodrigestivill/postgres-backup-local
    networks:
      data-cambelt: {}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${PGDATABASE:-cambelt}
      POSTGRES_USER: ${PGUSER:-cambelt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SCHEDULE: "0 */6 * * *"                            # every 6h — a fresh dump always predates an auto-update
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      POSTGRES_EXTRA_OPTS: "--clean --if-exists"         # dumps carry DROPs, so a restore overwrites cleanly
      TZ: ${TZ:-Europe/London}
    volumes:
      - ${DATA_ROOT:-/volume1/docker/cartracker}/backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Deliberately NOT watchtower-labelled — the database and its backup tool are never auto-updated.

  # It selects containers by label and then follows THE TAG EACH ONE WAS CREATED FROM, not the TAG value in
  # .env. So changing channel (stable <-> edge) needs `docker compose up -d` - Container Manager's *Build* -
  # and a Restart silently leaves you on the old channel.
  watchtower:
    profiles: [standalone]
    image: containrrr/watchtower
    # On data-cambelt only because a Compose service must be on some network; it talks to the Docker socket
    # and needs no network reachability at all. Emphatically not `edge`.
    networks:
      data-cambelt: {}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"   # only update the labelled webapi+gateway, never postgres/backup/itself
      WATCHTOWER_POLL_INTERVAL: "300"   # check Docker Hub every 5 minutes
      WATCHTOWER_CLEANUP: "true"        # prune the images it replaces
      TZ: ${TZ:-Europe/London}
    restart: unless-stopped
