name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A plain rebuild button: publish the current main as an edge image without any source change. For a
  # base-image security patch, or a publish that failed after a green build. It is no longer an escape hatch
  # from a gate: releases come from a `v*` tag and do not run through this workflow at all.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # v7 refuses to check out fork pull-request code by default. Safe here because this is a single-owner
      # repo and its PRs come from branches within it - but the day someone forks and opens one, the failure
      # would be baffling without this line.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          # Must match deploy/Dockerfile.gateway's node image, and there is a comment there saying so. That
          # image builds the SPA that actually ships; if CI proves it on a different Node then the bundle
          # users receive was produced by a runtime no test ever ran on. Nothing enforces the pair - not the
          # compiler, not a test - so they move together by hand.
          node-version: '24'
          cache: npm
          cache-dependency-path: src/CarTracker.WebApp/package-lock.json

      # Building the WebApi rewrites api-contract/v1.json — that is the point. If a C# change altered the
      # shape and nobody rebuilt, the file on disk now differs from the committed one.
      - name: Build .NET
        run: dotnet build --configuration Release

      # The generated types are committed, so they can be reviewed and so the front end builds without the
      # backend toolchain. That only holds if they cannot drift.
      - name: Install web dependencies
        working-directory: src/CarTracker.WebApp
        run: npm ci

      - name: Regenerate API types
        working-directory: src/CarTracker.WebApp
        run: npm run gen:api

      - name: Fail if the contract or the generated types are stale
        run: |
          if ! git diff --exit-code -- api-contract src/CarTracker.WebApp/src/api/generated; then
            echo ""
            echo "The API contract or its generated types are out of date."
            echo "A C# change altered the wire shape and the regenerated output was not committed."
            echo "Run:  dotnet build && cd src/CarTracker.WebApp && npm run gen:api"
            echo "then commit api-contract/v1.json and src/api/generated/."
            exit 1
          fi

      - name: Web typecheck, tests and build
        working-directory: src/CarTracker.WebApp
        run: |
          npx tsc -b --force
          npm test
          npm run build

      # Testcontainers starts a real PostgreSQL 18 and applies the migrations. Not the in-memory provider,
      # which ignores column types, check constraints and FK behaviour — i.e. most of what the schema asserts.
      - name: .NET tests
        run: dotnet test --configuration Release --no-build

  # Build and push the deployment images to Docker Hub - only after the tests + contract gate pass, and only
  # on a real push to main (never on PRs). What it publishes is the EDGE channel: the tip of main, which the
  # dogfooding NAS follows. It does not publish a release. A release is a git tag, and release.yml beside this
  # file turns one into :<version> + :latest + :stable by retagging the very digest built here.
  #
  # This job used to decide whether a release happened, by comparing the VERSION file against the commit the
  # push started from. That made a forgotten bump indistinguishable from a successful deploy, which needed a
  # loud summary block and a workflow_dispatch escape hatch to compensate for. The tag carries that decision
  # now, so the only question left here is the cheap one: did anything that can affect an image change?
  publish:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      # Full history: the relevance check below diffs against the commit the push started from, and the
      # default shallow clone does not have it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Facts about this build, read once and used by both the tags and the labels. The version is the file
      # rather than the git tag because .dockerignore excludes .git, so nothing inside either image build can
      # read history - DEC-021 carries the argument.
      - name: Read build facts
        id: ver
        run: |
          echo "v=$(tr -d ' \t\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Compare against the commit the push STARTED from, not HEAD^ - a push can carry several commits. A
      # wrong answer is cheap in both directions: one extra edge build, or one skipped. Neither can stop a
      # release, which is the thing the VERSION gate this replaces could do silently.
      - name: Does anything here affect an image?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before='${{ github.event.before }}'
          changed=""
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            changed="$(git diff --name-only "$before" HEAD || true)"
          fi

          # No usable base - a first push, or a force-push that orphaned it. Publish rather than guess.
          if [ -z "$changed" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=no usable base commit, so publishing rather than guessing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # docs/ and archive/ are excluded from the build context by .dockerignore, and root markdown is
          # COPYed by neither Dockerfile (both name their inputs explicitly - there is no `COPY . .`), so a
          # commit confined to those three cannot change either image. Anything else can: src/**/*.md DOES
          # arrive, via `COPY src/CarTracker.WebApp/ ./`, and a workflow edit is worth a rebuild anyway.
          if printf '%s\n' "$changed" | grep -qvE '^(docs/|archive/|[^/]*\.md$)'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=$(printf '%s\n' "$changed" | wc -l | tr -d ' ') file(s) changed" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=documentation only" >> "$GITHUB_OUTPUT"
          fi

      # The summary carries the release command, because publishing edge is the moment you can see the number
      # and decide whether it is worth blessing. Nothing here is urgent: a skipped edge build costs an edge
      # build, and the release path does not run through this job at all.
      - name: Say what happened
        run: |
          if [ "${{ steps.gate.outputs.publish }}" = "true" ]; then
            {
              echo "### Publishing edge (${{ steps.ver.outputs.v }})"
              echo ""
              echo "\`:edge\` and \`:${{ github.sha }}\` - ${{ steps.gate.outputs.reason }}."
              echo ""
              echo "**This is not a release.** Tag the commit to publish \`:${{ steps.ver.outputs.v }}\`, \`:latest\` and \`:stable\`:"
              echo ""
              echo '```'
              echo 'git tag -a v${{ steps.ver.outputs.v }} -m "${{ steps.ver.outputs.v }}"'
              echo 'git push origin v${{ steps.ver.outputs.v }}'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### No images published"
              echo ""
              echo "${{ steps.gate.outputs.reason }}, so nothing was pushed and the edge channel did not move."
              echo ""
              echo "Releases are unaffected - they come from a \`v*\` tag, not from this job."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.gate.outputs.publish == 'true'

      - uses: docker/login-action@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The labels go through the action rather than a LABEL line, so neither Dockerfile needs an ARG -
      # deploy/Dockerfile.gateway says NO BUILD ARGUMENTS in capitals and means it.
      #
      # They record only what was true when the image was written. None of them says "stable": that is a
      # judgement made days later, so it is a moving tag, and imagetools cannot add a label to an existing
      # manifest anyway. The revision matters most - .dockerignore excludes .git and
      # IncludeSourceRevisionInInformationalVersion is false, so this is the only place a running container
      # can say which commit built it.
      - name: Build and push WebApi
        if: steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.webapi
          push: true
          platforms: linux/amd64   # Intel Synology; add linux/arm64 if the NAS is ARM
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cartracker-webapi:edge
            ${{ secrets.DOCKERHUB_USERNAME }}/cartracker-webapi:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Cambelt WebApi
            org.opencontainers.image.version=${{ steps.ver.outputs.v }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.ver.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The two Dockerfiles hand-maintain their COPY lists, and a forgotten VERSION or Directory.Build.props
      # fails nothing: `dotnet build`, the tests and the contract gate all pass from the working tree, where
      # the files are simply there. The image would just quietly report the SDK default 1.0.0 again - which is
      # the bug this whole arrangement exists to fix, and it took a look at /api/meta on the NAS to notice.
      #
      # deps.json names the project as CarTracker.WebApi/<version>, so this needs no database, no Auth0
      # credential and no container boot - unlike hitting /api/meta, which needs all three.
      #
      # Against the sha tag rather than the version tag, because this job no longer publishes one. The release
      # workflow retags this exact digest, so what is proved here is what ships.
      - name: Prove the shipped WebApi carries the released version
        if: steps.gate.outputs.publish == 'true'
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cartracker-webapi:${{ github.sha }}
          V: ${{ steps.ver.outputs.v }}
        run: |
          docker pull "$IMAGE"
          deps=$(docker run --rm --entrypoint cat "$IMAGE" /app/CarTracker.WebApi.deps.json)
          got=$(printf '%s' "$deps" | grep -o '"CarTracker\.WebApi/[^"]*"' | head -1)
          echo "deps.json says: $got"
          if [ "$got" != "\"CarTracker.WebApi/$V\"" ]; then
            echo "FAIL: the published image reports $got, not $V."
            echo "deploy/Dockerfile.webapi is probably missing VERSION or Directory.Build.props from its COPY list."
            exit 1
          fi

      - name: Build and push Gateway
        if: steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.gateway
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cartracker-gateway:edge
            ${{ secrets.DOCKERHUB_USERNAME }}/cartracker-gateway:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Cambelt Gateway
            org.opencontainers.image.version=${{ steps.ver.outputs.v }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.ver.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # One image, so this proves the runtime config rather than a second build of it.
      #
      # The gateway serves /config.js from its own environment and emits the Content-Security-Policy as a
      # response header naming that same tenant. Both used to be compiled into the bundle, which meant two
      # images per release and no way for anyone else to self-host. Nothing in the .NET or web test suites can
      # see either - the gateway has no test project and the policy no longer exists at build time - so the
      # check is a running container with a tenant that appears nowhere in the source.
      #
      # It matters most for the CSP, because that change fails OPEN: a broken middleware emits no policy at
      # all and every page still looks perfectly normal.
      - name: Prove the gateway configures itself at run time
        if: steps.gate.outputs.publish == 'true'
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cartracker-gateway:${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          docker run -d --rm -p 8099:8080 --name gwprobe             -e ASPNETCORE_ENVIRONMENT=Production             -e Auth0__Domain=probe.eu.auth0.com             -e Auth0__ClientId=PROBE_ID             -e Auth0__Audience=probe.api "$IMAGE"
          for i in $(seq 1 30); do curl -fsS localhost:8099/ >/dev/null 2>&1 && break; sleep 1; done

          fail() { echo "FAIL: $1"; docker logs gwprobe || true; docker rm -f gwprobe >/dev/null 2>&1; exit 1; }

          curl -s localhost:8099/config.js | grep -q 'probe.eu.auth0.com' || fail "/config.js does not carry the configured tenant"
          curl -s localhost:8099/config.js | grep -q 'PROBE_ID'           || fail "/config.js does not carry the configured client id"

          csp=$(curl -s -D - -o /dev/null localhost:8099/ | grep -i '^content-security-policy:')
          [ -n "$csp" ]                                  || fail "no Content-Security-Policy header on the document"
          echo "$csp" | grep -q "connect-src 'self' https://probe.eu.auth0.com" || fail "the policy does not permit the configured tenant"
          echo "$csp" | grep -q "script-src 'self' 'sha256-"                    || fail "the policy carries no script hash"
          echo "$csp" | grep -q "img-src 'self' data: blob:"                    || fail "img-src lost blob:, so every document photo is a broken icon"
          echo "$csp" | grep -q "font-src 'self'"                               || fail "font-src is not self, which is DEC-010"

          # Deep links are served by MapFallbackToFile rather than UseStaticFiles, which is why the middleware
          # keys off the content type instead of the path.
          curl -s -D - -o /dev/null localhost:8099/bt53akj/fuel | grep -qi '^content-security-policy:' || fail "SPA deep links get no policy"

          # A surviving meta tag would INTERSECT with the header, leaving connect-src as 'self' alone - and it
          # would break login only on deployments that had configured themselves correctly.
          [ "$(curl -s localhost:8099/ | grep -c 'http-equiv="Content-Security-Policy"')" = "0" ]             || fail "the build still emits a CSP meta tag, which intersects the header"

          echo "OK - runtime config and policy both follow the environment"
          docker rm -f gwprobe >/dev/null 2>&1
